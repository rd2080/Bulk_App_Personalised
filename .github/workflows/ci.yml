name: CI

on:
  pull_request:
  push:
    # claude/** so CI also runs on branches whose PRs are opened by Auto PR
    # (PRs opened with the workflow token do not trigger pull_request workflows).
    branches: [main, 'claude/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      # python -m pytest puts the repo root on sys.path; -ra lists every failure/error reason.
      - run: python -m pytest -q -ra --tb=short
