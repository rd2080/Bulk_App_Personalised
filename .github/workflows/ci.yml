name: CI

# Runs the test suite. Branch pushes are tested and shipped by ship.yml, which calls this workflow.

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway empty Postgres (synthetic, discarded after the run) so every page can be
    # rendered for real by tests/test_app_smoke.py. It never touches Neon.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SMOKE_DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations to the throwaway database
        run: |
          for f in $(ls database/migrations/*.sql | sort); do
            echo "applying $f"
            psql "$SMOKE_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      # python -m pytest puts the repo root on sys.path; -ra lists every failure/error reason.
      # On failure the tail of the output is published as an annotation so it is
      # readable without signing in to view the step logs.
      - name: Run tests
        run: |
          set +e
          python -m pytest -q -ra --tb=short 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          import pathlib
          text = pathlib.Path("pytest.log").read_text()[-3500:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest failed::{text}")
          PY
          fi
          exit "$code"
