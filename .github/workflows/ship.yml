name: Ship

# Pushing a claude/** branch runs the tests. If they pass, a PR is opened and
# squash-merged into main automatically (Streamlit Cloud then redeploys).
# Failing tests leave the branch unmerged. Add "[hold]" to the head commit
# message to test a branch without merging it.

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ship-main
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  merge:
    needs: test
    if: ${{ !contains(github.event.head_commit.message, '[hold]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Open PR if missing, then squash-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --head "$GITHUB_REF_NAME" --base main --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh pr create --base main --head "$GITHUB_REF_NAME" \
              --title "$(git log -1 --format=%s)" \
              --body "$(git log -1 --format=%b)"
          fi
          gh pr merge "$GITHUB_REF_NAME" --squash
