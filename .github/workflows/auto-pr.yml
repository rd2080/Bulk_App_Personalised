name: Auto PR

# Opens a pull request into main whenever a claude/* branch is pushed, so the
# owner only has to review and merge. Merging stays a manual, human step.

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open PR if none is open for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --head "$GITHUB_REF_NAME" --base main --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "A PR is already open for $GITHUB_REF_NAME."
            exit 0
          fi
          gh pr create --base main --head "$GITHUB_REF_NAME" \
            --title "$(git log -1 --format=%s)" \
            --body "$(git log -1 --format=%b)"
